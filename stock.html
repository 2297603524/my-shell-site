<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个股基本面分析 - 公司概况、财务指标、三大报表、主营构成">
  <title>个股基本面 · 股析</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html"><span class="logo">析</span>股析</a>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索代码 / 名称 / 拼音，如 600519、茅台" autocomplete="off">
        <div class="search-suggest" id="search-suggest"></div>
      </div>
    </nav>
  </header>

  <main class="container">
    <!-- 公司概况 -->
    <div class="card" id="profile-card">
      <div class="card-title">公司概况</div>
      <div class="state-box"><div class="spin"></div>加载公司概况中…</div>
    </div>

    <!-- 财务主要指标 -->
    <div class="card">
      <div class="card-title">财务主要指标（近 8 期报告）</div>
      <div class="table-wrap">
        <table class="stock-table" id="ind-table">
          <thead>
            <tr>
              <th>报告期</th>
              <th>营业收入</th>
              <th>营收同比</th>
              <th>归母净利润</th>
              <th>净利同比</th>
              <th>ROE</th>
              <th>毛利率</th>
              <th>净利率</th>
              <th>资产负债率</th>
              <th>EPS</th>
              <th>每股净资产</th>
              <th>每股经营现金流</th>
            </tr>
          </thead>
          <tbody id="ind-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- 三大报表 -->
    <div class="card">
      <div class="card-title">三大报表摘要（最新一期）</div>
      <div class="metric-grid" id="bs-grid"></div>
      <div class="metric-grid" id="is-grid"></div>
      <div class="metric-grid" id="cf-grid"></div>
    </div>

    <!-- 主营构成 -->
    <div class="card">
      <div class="card-title">主营构成（最新一期）</div>
      <div id="mainop-box"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>股析 · 基本面数据来源：东方财富 F10 公开数据（公司财务报告）· 数据仅供参考，不构成投资建议</p>
    <p style="margin-top:4px;">市场有风险，投资需谨慎</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/stock.js"></script>
</body>
</html>
